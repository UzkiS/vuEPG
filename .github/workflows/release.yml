name: Release

# 1. main 上有待处理的 changeset 时：创建 / 更新「chore: release」PR（升级版本号、生成 CHANGELOG）
# 2. 该 PR 合并后：发布到 npm（可信发布 + provenance），并创建 GitHub Release
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

jobs:
  release:
    name: Release
    if: github.repository == 'UzkiS/vuEPG'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Verify
        run: pnpm lint && pnpm typecheck && pnpm coverage && pnpm build

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/publish.ts
        env:
          GH_TOKEN: ${{ github.token }}
