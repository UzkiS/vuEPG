name: Release

# 1. main 上有待处理的 changeset 时：创建 / 更新「chore: release」PR（升级版本号、生成 CHANGELOG）
# 2. 该 PR 合并后：发布到 npm（可信发布 + provenance），并创建 GitHub Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      legacy_ref:
        description: "要发布的 1.x 标签，例如 v1.2.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

jobs:
  release:
    name: Release
    if: github.repository == 'UzkiS/vuEPG' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Verify
        run: pnpm build && pnpm lint && pnpm typecheck && pnpm coverage

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: node scripts/prepare-release.ts
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/publish.ts
        env:
          GH_TOKEN: ${{ github.token }}

  legacy:
    name: Release 1.x
    if: github.repository == 'UzkiS/vuEPG' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate tag
        env:
          LEGACY_REF: ${{ inputs.legacy_ref }}
        run: |
          [[ "$LEGACY_REF" =~ ^v1\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.legacy_ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify package
        env:
          LEGACY_REF: ${{ inputs.legacy_ref }}
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$LEGACY_REF"
          test "$(node -p 'require("./package.json").publishConfig.tag')" = "legacy"

      - run: pnpm check
      - run: npm publish --tag legacy --provenance
