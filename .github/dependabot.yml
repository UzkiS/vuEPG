version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # npm 更新覆盖整个 pnpm workspace；精确版本号不阻止 Dependabot 改写清单。
      # typescript-eslint 的 peer 范围要求 TypeScript < 6.1，保留 6.0 的修复更新。
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # 8.71.0 的 no-unsafe-enum-assignment 在示例 polyfills.ts 检查时栈溢出。
      # 仅跳过已失败版本，后续修复版仍可提交并通过 CI 验证。
      - dependency-name: typescript-eslint
        versions: ["8.71.0"]
      # 同名 workspace 依赖会被统一改写到一个候选版本，minor / patch 也可能
      # 将另一个工程降级。Vue、Vite、Node 类型交由 Agent 按工程分别升级。
      # 示例使用 Vue 2.7，根工程使用 Vue 3，停用此依赖的自动更新。
      - dependency-name: vue
      # 用于测试 Vue 2.7 的别名依赖，固定在 2.x
      - dependency-name: vue2
        update-types: [version-update:semver-major]
      # Vue 2 模板编译器须与运行时配套。
      - dependency-name: vue-template-compiler
        update-types: [version-update:semver-major]
      # vue-loader 15 用于 Vue 2，后续主版本使用 Vue 3 编译链。
      - dependency-name: vue-loader
        update-types: [version-update:semver-major]
      # @vitejs/plugin-vue2 2.3.4 的 peer 范围最高为 Vite 7。
      # 示例 Vite 7 与根工程 Vite 8 分别维护，停用此依赖的自动更新。
      - dependency-name: vite
      # 示例声明可在 Node 22 上运行，类型不能自动换到更高 Node 主版本。
      # 与根工程的 Node 类型分别维护，停用此依赖的自动更新。
      - dependency-name: "@types/node"

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
